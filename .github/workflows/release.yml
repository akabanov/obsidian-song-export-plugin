# Builds the plugin and publishes a GitHub release that BRAT can install.
#
# Start a release from the Actions tab (Release Obsidian plugin → Run workflow)
# or from a terminal:
#
#     gh workflow run release.yml                        # next beta: 0.1.0-beta.1 → 0.1.0-beta.2
#     gh workflow run release.yml -f version=0.2.0-beta.1
#     gh workflow run release.yml -f version=minor       # stable: 0.1.0 → 0.2.0
#
# `version` is an explicit version or an `npm version` keyword (patch, minor,
# major, prepatch, preminor, premajor, prerelease; pre-releases use the `beta`
# id). The workflow refreshes the settings screenshots in docs/screenshots,
# bumps package.json, manifest.json and versions.json, commits and tags the
# bump on the branch it runs on (normally main; pick another with --ref), then
# builds and publishes the release.
# Versions with a pre-release suffix (`-beta.N`) are published as GitHub
# pre-releases.
#
# Pushing a tag by hand (`npm version <x.y.z> && git push --follow-tags`) also
# publishes a release for that tag, without bumping anything.

name: Release Obsidian plugin

on:
    workflow_dispatch:
        inputs:
            version:
                description: 'Version (e.g. 0.2.0-beta.1) or npm version keyword (prerelease, patch, minor, major)'
                required: true
                default: prerelease
    push:
        tags:
            - '*'

concurrency:
    group: release
    cancel-in-progress: false

jobs:
    release:
        runs-on: ubuntu-latest
        if: github.event_name == 'push' || startsWith(github.ref, 'refs/heads/')
        permissions:
            contents: write
            id-token: write
            attestations: write
        steps:
            - uses: actions/checkout@v6
              with:
                  fetch-depth: 0

            - name: Use Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: 'npm'

            - name: Install, test and lint
              run: |
                  npm ci
                  npm test
                  npm run lint

            - name: Cache Obsidian
              if: github.event_name == 'workflow_dispatch'
              uses: actions/cache@v4
              with:
                  path: ~/.obsidian-cache
                  key: obsidian-${{ hashFiles('scripts/screenshots.mjs') }}

            - name: Update settings screenshots
              if: github.event_name == 'workflow_dispatch'
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  npm run build
                  xvfb-run -a npm run screenshots

            - name: Bump version, commit and tag
              if: github.event_name == 'workflow_dispatch'
              env:
                  VERSION: ${{ inputs.version }}
              run: |
                  git config user.name 'github-actions[bot]'
                  git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
                  git add docs/screenshots
                  git diff --cached --quiet || git commit -m 'Update settings screenshots'
                  npm version "$VERSION" --preid beta -m 'Release %s'
                  tag="$(node -p 'require("./package.json").version')"
                  git push --atomic origin "HEAD:$GITHUB_REF_NAME" "refs/tags/$tag"

            - name: Resolve tag
              id: tag
              run: |
                  if [ "$GITHUB_EVENT_NAME" = push ]; then
                    tag="${GITHUB_REF#refs/tags/}"
                  else
                    tag="$(node -p 'require("./package.json").version')"
                  fi
                  manifest_version="$(node -p 'require("./manifest.json").version')"
                  if [ "$tag" != "$manifest_version" ]; then
                    echo "::error::Tag $tag doesn't match manifest.json version $manifest_version"
                    exit 1
                  fi
                  echo "tag=$tag" >> "$GITHUB_OUTPUT"
                  case "$tag" in
                    *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
                    *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
                  esac

            - name: Build plugin
              run: npm run build

            - name: Attest build provenance
              uses: actions/attest@v4
              with:
                  subject-path: main.js

            - name: Create release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  TAG: ${{ steps.tag.outputs.tag }}
                  PRERELEASE: ${{ steps.tag.outputs.prerelease }}
              run: |
                  flags=()
                  [ "$PRERELEASE" = true ] && flags+=(--prerelease)
                  gh release create "$TAG" \
                    --title "$TAG" \
                    --generate-notes \
                    "${flags[@]}" \
                    main.js manifest.json
